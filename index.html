<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Personalized daily AI and business opportunity feed."><title>Opportunity Radar</title><link rel="stylesheet" href="styles.css"></head>
<body><header class="hero"><nav><span class="brand">JJMOW / RADAR</span><button id="theme" aria-label="切換深色模式">◐</button></nav><div class="hero-copy"><p class="eyebrow">DAILY SIGNAL, NOT NOISE</p><h1>發現下一個<br><em>值得行動的機會</em></h1><p class="lede">每天精選 AI、開發工具與商業訊號，將資訊轉成可立即採取的下一步。</p><div class="meta"><span id="updated">載入中…</span><span id="count"></span></div></div></header>
<main><section class="date-navigation" aria-label="報告日期"><button id="previous-day" type="button" aria-label="前一個可用報告日期">←</button><div><p class="eyebrow">目前瀏覽</p><strong id="selected-date"></strong></div><button id="next-day" type="button" aria-label="下一個可用報告日期">→</button><label class="date-picker-label">選擇日期 <input id="date-picker" type="date" aria-label="選擇報告日期"></label><button id="latest" type="button">查看最新報告</button></section><p id="feed-status" class="feed-status" role="status" aria-live="polite" hidden></p><section class="controls" aria-label="摘要控制項"><div id="filters" class="filters"></div><input id="search" type="search" placeholder="搜尋 agent、crypto、SaaS…" aria-label="搜尋"></section><section id="feed" class="feed" aria-live="polite"></section><p id="empty" class="empty" hidden>沒有可顯示的機會。</p></main>
<template id="card-template"><article class="card"><div class="card-top"><span class="category"></span><button class="save" aria-label="收藏">☆</button></div><h2><a class="title" target="_blank" rel="noopener noreferrer"></a></h2><p class="summary"></p><dl><div><dt>為何重要</dt><dd class="relevance"></dd></div><div class="opportunity-box"><dt>機會</dt><dd class="opportunity"></dd></div><div><dt>下一步行動</dt><dd class="action"></dd></div></dl><footer><span class="source"></span><time></time><span class="score"></span></footer></article></template><script type="module" src="app.js"></script></body></html>
